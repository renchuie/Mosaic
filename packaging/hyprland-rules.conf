# Optional Hyprland rules for Mosaic (window class stays "studydesk"). Not installed automatically.
# Without any rule the app simply tiles like every other window.
#
# To make it open floating and centred, paste ONE of these into
# ~/.config/hypr/custom/rules.conf, then run: hyprctl reload
# Check the class first with:  hyprctl clients | grep -i class
#
# Hyprland 0.53 and newer:
# windowrule = match:class ^(studydesk)$, float on, size 1320 860, center on
#
# Hyprland 0.52 and older:
# windowrulev2 = float, class:^(studydesk)$
# windowrulev2 = size 1320 860, class:^(studydesk)$
# windowrulev2 = center, class:^(studydesk)$
