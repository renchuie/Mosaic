[package]
name = "studydesk"
version = "0.1.0"
description = "Personal student dashboard"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ruzstd = "0.7"
rusqlite = { version = "0.32", features = ["bundled", "collation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
